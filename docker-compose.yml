# Produkcni gap audit (30.10.2026): minimalni, bounded nasazeni pro 1
# detekcni uzel - server + Redis pro broker (H5). `docker compose config`
# overil syntax, CI `docker` job overil, ze samotny image skutecne bezi
# (viz komentar v Dockerfile) - `docker compose up` samotny jeste lokalne
# nezkouseno (rozbite Docker Desktop na vyvojovem stroji).
#
# `--require-api-token` je tu zapnuty vedome (ne CLI/server.rs vychozi
# `false`) - audit nalez byl prave "anonymous-admin je
# vychozi, i /automation/restart s nim spusti aktivni sken". Produkcni
# nasazeni by nemelo tohle riziko znovu tise zdedit. SALTICUS_API_TOKEN je
# POVINNY (zadna vychozi hodnota) - `docker compose up` bez neho spadne na
# config.rs's vlastni fail-closed kontrole, ne tise pobezi bez autentizace.
# Pro rychle lokalni vyzkouseni bez tokenu: `docker compose run --rm salticus
# server spust --workspace /data/workspace --host 0.0.0.0`.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  salticus:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - salticus-workspace:/data/workspace
    environment:
      - SALTICUS_API_TOKEN=${SALTICUS_API_TOKEN:?nastav SALTICUS_API_TOKEN (napr. v .env) pred 'docker compose up'}
    command:
      [
        "server",
        "spust",
        "--workspace",
        "/data/workspace",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--require-api-token",
        "--api-token-env",
        "SALTICUS_API_TOKEN"
      ]

volumes:
  salticus-workspace:
  redis-data:
