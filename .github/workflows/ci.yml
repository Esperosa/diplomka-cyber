name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (non-blocking)
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: Test
        run: cargo test

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build UI
        run: npm run build:ui

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bakula-program:ci-smoke

      - name: Container starts and serves /api/health
        run: |
          docker run -d --name bakula-smoke -p 8080:8080 bakula-program:ci-smoke \
            server spust --workspace /data/workspace --host 0.0.0.0 --port 8080
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 1
          done
          echo "server never answered /api/health" >&2
          docker logs bakula-smoke >&2
          exit 1
